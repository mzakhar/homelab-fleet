# Browser-facing routes for the investigation UIs.
#
# These are NOT an auth boundary by themselves. Cloudflare Access must have an
# admin-only policy on each hostname before the DNS record exists, because
# Grafana runs with anonymous Viewer access enabled and Uptime Kuma's status
# page is public by design. Access is the only thing standing in front of them.
#
# Telemetry ingestion and storage stay internal: Tempo, Loki, Prometheus,
# Alertmanager, kube-state-metrics, and the OTel receivers get no Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
  annotations:
    gethomepage.dev/enabled: "false"
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.zakharhome.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma
  namespace: observability
  labels:
    app.kubernetes.io/name: uptime-kuma
  annotations:
    gethomepage.dev/enabled: "false"
spec:
  ingressClassName: traefik
  rules:
    - host: uptime.zakharhome.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  name: http
