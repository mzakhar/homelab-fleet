# Reference only — NEVER applied by Flux (not listed in kustomization.yaml).
# Copy to ntfy-secret.yaml, fill in the URL, apply manually on themachine.
# Never commit ntfy-secret.yaml to git.
#
# On the public ntfy.sh server the topic name IS the credential: anyone who
# knows it can read every alert and publish fake ones. Use a long random topic
# and treat it like a password.
#
# Generate a topic:
#   python3 -c "import secrets; print('homelab-alerts-' + secrets.token_hex(8))"
#
# Subscribe on the phone: install ntfy, add subscription for that exact topic.
#
# FIRST-TIME CREATE ONLY — this declares the whole Secret, which is safe here
# only because `url` is the sole key and nothing else writes to it:
#   kubectl -n action-runner create secret generic action-runner-ntfy \
#     --from-literal=url=https://ntfy.sh/<topic>
#
# ROTATE THE TOPIC, OR UPDATE ANY KEY ON A SECRET THAT ALREADY EXISTS — use a
# merge patch. See AGENTS.md: piping `create secret --dry-run=client -o yaml`
# into `kubectl apply` declares the entire Secret and drops every key it was
# not given, which crashes pods consuming the Secret through envFrom.
#   kubectl -n action-runner patch secret action-runner-ntfy --type merge \
#     -p "{\"data\":{\"url\":\"$(printf %s https://ntfy.sh/<topic> | base64 -w0)\"}}"
#
# `patch` takes base64 under `data`; `stringData` is not available here. The
# `-w0` flag is GNU coreutils, which is what themachine has — on BSD or macOS
# use `base64` with no flag.
#
# envFrom and secretKeyRef values are read when a Pod is created, so restart
# only after the patch lands, and let the new Pod reach Ready before assuming
# the change took:
#   kubectl -n action-runner rollout restart deploy/action-runner
#   kubectl -n action-runner rollout status deploy/action-runner
#
# Alert push is skipped entirely when this secret is absent (secretKeyRef is
# optional), so the cluster stays healthy without it.
#
# Longer term this file should stop existing; see specs/secret-management.md.
#
apiVersion: v1
kind: Secret
metadata:
  name: action-runner-ntfy
  namespace: action-runner
type: Opaque
stringData:
  url: https://ntfy.sh/REPLACE-WITH-RANDOM-TOPIC
