apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: audio-tools
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/mzakhar/Audio-Tools
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synth
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: audio-tools
  wait: true
  timeout: 5m
  # The app repo's deployment.yaml references the floating :main tag. Pin the
  # digest here, the same way clean-mail is pinned, so a rebuild of :main never
  # rolls the cluster on its own — a deploy is a change to this file.
  # cc200a8 = DAW-control assistant with plan forward references: an action can
  # reference a track/clip/module an earlier action creates, ids are pre-minted
  # so a plan fully validates before it applies. Upstream failures answer 424.
  images:
    - name: ghcr.io/mzakhar/audio-tools
      digest: sha256:ddab460cf810aae4b3c06ce34ba7c42973f7e6f05c73651cc623b13c18eee39a
    - name: ghcr.io/mzakhar/audio-tools-discovery
      digest: sha256:386e4d3a9e77e24051faef8682cc14b3d257415f9970a02f9a5085cd4a807df9
