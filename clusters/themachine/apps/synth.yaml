apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: audio-tools
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/mzakhar/Audio-Tools
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synth
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: audio-tools
  wait: true
  timeout: 5m
  # The app repo's deployment.yaml references the floating :main tag. Pin the
  # digest here, the same way clean-mail is pinned, so a rebuild of :main never
  # rolls the cluster on its own — a deploy is a change to this file.
  # sha256:631e5524 = Audio-Tools e4ef29d (browse a folder of SoundFonts and
  # import one preset; stereo, ROM and SF3 samples no longer fail a whole bank).
  images:
    - name: ghcr.io/mzakhar/audio-tools
      digest: sha256:631e5524d8a63695e35f27f8851574bec3ce557e28a61fea44c77a5eaca9f074
