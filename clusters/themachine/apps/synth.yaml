apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: audio-tools
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/mzakhar/Audio-Tools
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synth
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: audio-tools
  wait: true
  timeout: 5m
  # The app repo's deployment.yaml references the floating :main tag. Pin the
  # digest here, the same way clean-mail is pinned, so a rebuild of :main never
  # rolls the cluster on its own — a deploy is a change to this file.
  # a0d4bb6 = discovery proxy image includes its web-search adapter.
  images:
    - name: ghcr.io/mzakhar/audio-tools
      digest: sha256:a55c32b8a9eb45748edbcb0b3590cb54bf5cf15c7699aae466aaf59b073fad82
    - name: ghcr.io/mzakhar/audio-tools-discovery
      digest: sha256:c0b39f9dbbbe31339df4d94b310dcc065e8ba48cb98841fe710b44b2c191dadc
