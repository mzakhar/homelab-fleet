apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]

      - job_name: linux-hosts
        static_configs:
          - targets:
              - "192.168.1.3:9100"
            labels:
              instance: themachine
              role: web-app-host
          - targets:
              - "192.168.1.2:9100"
            labels:
              instance: homeserver
              role: media-nas
          - targets:
              - "192.168.1.48:9100"
            labels:
              instance: kitchen-hub
              role: kitchen-kiosk

      - job_name: otel-collector
        static_configs:
          - targets:
              - "otel-collector:8888"
              - "otel-collector:9464"

      - job_name: observability-services
        metrics_path: /metrics
        static_configs:
          - targets:
              - "tempo:3200"

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - "kube-state-metrics:8080"

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: "(.+)"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: "([^:]+)(?::\\d+)?;(\\d+)"
            replacement: "$1:$2"
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: app

      - job_name: kubernetes-service-endpoints
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: "(.+)"
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: "([^:]+)(?::\\d+)?;(\\d+)"
            replacement: "$1:$2"
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: replace
            target_label: endpoint

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: observability
data:
  alert-rules.yml: |
    groups:
      - name: homelab.rules
        rules:
          - alert: PrometheusTargetDown
            expr: up == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus target down"
              description: "{{ $labels.job }} target {{ $labels.instance }} has been down for more than 2 minutes."

          # kitchen-hub is excluded because rebooting is its self-heal, not an
          # event: kiosk-health.sh reboots on a vanished touchscreen, so this
          # alert fired 12 times over 2026-08-14..17 reporting the remedy for a
          # fault KitchenHubSelfHealThrashing was already reporting.
          - alert: HostRebooted
            expr: changes(node_boot_time_seconds{instance!="kitchen-hub"}[15m]) > 0
            labels:
              severity: warning
            annotations:
              summary: "Host rebooted"
              description: "{{ $labels.instance }} boot time changed in the last 15 minutes."

          - alert: KitchenHubTouchscreenMissing
            expr: kitchen_hub_touchscreen_present == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Kitchen Hub touchscreen missing"
              description: "kitchen-hub no longer sees the ILITEK USB touchscreen."

          - alert: KitchenHubKioskUnavailable
            expr: kitchen_hub_kiosk_healthy == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Kitchen Hub kiosk unavailable"
              description: "kitchen-hub Chromium kiosk or screen-policy timer is not healthy."

          # KitchenHubSelfHealed was removed 2026-08-17. A rolling 1h counter
          # increase with no `for:` is a log line, not an alert: it stayed
          # firing for ~68 of 72h while the touchscreen fault ran, and every
          # notification said only that the box had done what it is built to
          # do. kitchen_hub_selfheal_total is still exported and still on the
          # Grafana panel; KitchenHubSelfHealThrashing below is the rung that
          # pages, because it fires on the self-heal failing to help.

          # changes(), not increase(): increase() extrapolates, so a single
          # reboot in the window evaluates to ~1.0007 and any "> 1" threshold
          # trips on one event. That shipped and fired critical for 79% of its
          # first 60h. changes() counts increments exactly.
          #
          # Retuned 2026-08-19 alongside the self-heal cooldown, 6h -> 1h. The
          # old threshold read "saturated": a 6h cooldown caps reboots at 4/day,
          # so >= 3 meant the fault recurred nearly every time a reboot was
          # allowed. A 1h cooldown caps at 24/day and that reasoning does not
          # transfer -- the saturation-equivalent would be ~18, which is far too
          # many dead panel-hours to sit through before anyone is told.
          #
          # So this is a rate threshold now, not a saturation one. Observed rate
          # after the 2026-08-18 PSU and cable swaps is 2-3/day; >= 8 is roughly
          # 3x that and a third of the cap, which is unambiguously "not
          # clearing" without waiting for the ceiling.
          - alert: KitchenHubSelfHealThrashing
            expr: sum by (instance) (changes(kitchen_hub_selfheal_total{action=~"reboot_.*"}[24h])) >= 8
            labels:
              severity: critical
            annotations:
              summary: "Kitchen Hub rebooting repeatedly"
              description: "kitchen-hub self-healed by rebooting 8 or more times in 24h, against a baseline of 2-3. Rebooting is the only action that recovers this panel, so a rate this high means the underlying fault is not clearing and needs hardware attention."

          - alert: NodeFilesystemAlmostFull
            expr: 100 * (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) > 85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Node filesystem almost full"
              description: "{{ $labels.instance }} {{ $labels.mountpoint }} is above 85% used."

          - alert: NodeFilesystemCritical
            expr: 100 * (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) > 95
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node filesystem critical"
              description: "{{ $labels.instance }} {{ $labels.mountpoint }} is above 95% used."

          - alert: KubernetesDeploymentUnavailable
            expr: kube_deployment_status_replicas_unavailable > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Kubernetes deployment unavailable"
              description: "{{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas."

          - alert: KubernetesPodRestartSpike
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod restart spike"
              description: "{{ $labels.namespace }}/{{ $labels.pod }} restarted more than 3 times in 15 minutes."

          - alert: OtelCollectorRefusedTelemetry
            expr: sum(rate(otelcol_receiver_refused_spans[5m])) + sum(rate(otelcol_receiver_refused_metric_points[5m])) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "OpenTelemetry Collector refusing telemetry"
              description: "Collector refused spans or metric points in the last 5 minutes."

          - alert: UptimeKumaStatusPageUnavailable
            expr: uptime_kuma_status_page_up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Uptime Kuma status page unavailable"
              description: "Action Runner cannot read the Uptime Kuma homelab status page."

          - alert: UptimeKumaMonitorDown
            # Public probes traverse Cloudflare and are intentionally advisory.
            # Kuma retains their event history; page only direct LAN/host checks.
            expr: uptime_kuma_monitor_up{group!="Public services"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Uptime Kuma monitor down"
              description: "Uptime Kuma monitor {{ $labels.monitor_name }} is currently down."

      # The alert path watching itself. Neither of these can page through the
      # path they describe: a broken ntfy hop cannot deliver news that ntfy is
      # broken. They surface on the Homepage alert count and in Grafana, which
      # is the point — a silent delivery failure previously left no trace at
      # all outside an in-memory field on action-runner.
      - name: alerting-pipeline.rules
        rules:
          - alert: AlertmanagerNotificationsFailing
            expr: sum(increase(alertmanager_notifications_failed_total[15m])) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Alertmanager cannot deliver notifications"
              description: "Alertmanager notification delivery failed in the last 15 minutes; alerts are firing but not reaching their receiver."

          - alert: ActionRunnerNtfyPushFailing
            expr: increase(action_runner_ntfy_publish_total{outcome="failure"}[15m]) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Alert push to ntfy failing"
              description: "Action Runner accepted Alertmanager notifications but could not push them to ntfy; alerts are not reaching the phone."

      - name: apps.rules
        # Stable HTTP semantic conventions only. Every instrumented app must
        # emit http_server_request_duration_seconds with http_response_status_code;
        # Python apps need OTEL_SEMCONV_STABILITY_OPT_IN=http or http/dup.
        rules:
          - alert: AppHttpServerErrorRate
            expr: |
              sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name!="",http_response_status_code=~"5.."}[5m]))
                /
              sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name!=""}[5m]))
                > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service_name }} 5xx rate above 5%"
              description: "{{ $labels.service_name }} served more than 5% HTTP 5xx responses over the last 5 minutes."

          - alert: AppHttpServerErrorRateCritical
            expr: |
              sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name!="",http_response_status_code=~"5.."}[5m]))
                /
              sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name!=""}[5m]))
                > 0.25
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.service_name }} 5xx rate above 25%"
              description: "{{ $labels.service_name }} served more than 25% HTTP 5xx responses over the last 5 minutes."

          - alert: AppHttpServerLatencyHigh
            expr: |
              histogram_quantile(0.95, sum by (service_name, le) (rate(http_server_request_duration_seconds_bucket{service_name!=""}[5m]))) > 3
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service_name }} p95 latency above 3s"
              description: "{{ $labels.service_name }} p95 HTTP server latency stayed above 3 seconds for 10 minutes."

          # Catches an app that silently drops off stable semconv (bad
          # OTEL_SEMCONV_STABILITY_OPT_IN, downgrade) and would otherwise lose
          # every app rule above without any alert firing.
          - alert: AppMissingStableHttpMetrics
            expr: |
              count by (service_name) (http_server_duration_milliseconds_count{service_name!=""})
                unless
              count by (service_name) (http_server_request_duration_seconds_count{service_name!=""})
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service_name }} emitting legacy HTTP metrics only"
              description: "An app exports http_server_duration_milliseconds but no http_server_request_duration_seconds, so app error and latency rules cannot evaluate for it."

      - name: clean-mail.rules
        rules:
          - alert: CleanMailFcmSendFailing
            expr: sum(rate(cleanmail_fcm_send_attempts_total{outcome!="success"}[10m])) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Clean Mail push delivery failing"
              description: "Clean Mail FCM send attempts returned a non-success outcome over the last 10 minutes."

          # Leading indicator for CleanMailGmailWatchExpiring below. On
          # 2026-08-08 the watch sat expired for ~22h while every hourly
          # renewal tick failed on a dead OAuth grant for one of two accounts;
          # this counter was already being exported and nothing read it. The
          # expiry gauge is min() across accounts, so a single dead account
          # drags it negative — catch the failing renewals ~2 days earlier.
          - alert: CleanMailGmailWatchRenewalFailing
            expr: sum(increase(cleanmail_gmail_watch_renewals_total{outcome="failure"}[1h])) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Clean Mail Gmail watch renewal failing"
              description: "Gmail watch renewal returned a failure outcome in the last hour; the watch will expire unless renewal recovers."

          # Gauge is seconds remaining until expiry, not an absolute epoch —
          # live value 536400 (~6.2 days). Do not subtract time() here.
          - alert: CleanMailGmailWatchExpiring
            expr: min(cleanmail_gmail_watch_expiration_seconds) < 86400
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Clean Mail Gmail watch expiring"
              description: "Clean Mail Gmail push watch expires in under 24 hours; renewal is failing or stalled."

          # Demotion silences the alerts that would otherwise catch a dead grant.
          # Since CleanMail-backend#130 an account whose persistent credential
          # returns invalid_grant leaves grant_state='active', and every hourly
          # job filters on that — so the failing refreshes stop being attempted,
          # cleanmail_oauth_refresh_total stops reporting invalid_grant, and
          # CleanMailGmailWatchRenewalFailing above goes quiet. That silence is
          # indistinguishable from recovery. Alert on the transition itself.
          #
          # No `for:` — this is a counter increment on a discrete state change,
          # not a condition that has to persist to be real. Waiting to confirm
          # it would only delay the notification.
          - alert: CleanMailGmailGrantDemoted
            expr: increase(cleanmail_gmail_grant_transition_total{transition="demoted"}[1h]) > 0
            labels:
              severity: critical
            annotations:
              summary: "Clean Mail Gmail grant demoted"
              description: "A Clean Mail Gmail account's persistent grant returned invalid_grant and was demoted out of 'active'. Background jobs now skip that account, so its mail ingestion is stopped until a browser refresh mirrors a live token back or the account is re-authorized."

          # Steady state puts every observation in the 750-1000s bucket, so a
          # quantile threshold near 900 is pure interpolation noise. Count the
          # observations above the next boundary instead — exact, no guessing.
          - alert: CleanMailGmailCursorStale
            expr: |
              sum(rate(cleanmail_gmail_cursor_age_seconds_bucket{le="+Inf"}[15m]))
                - sum(rate(cleanmail_gmail_cursor_age_seconds_bucket{le="2500"}[15m]))
                > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Clean Mail Gmail cursor falling behind"
              description: "Clean Mail Gmail sync cursor age exceeded 2500s; mail ingestion is lagging."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - services
      - endpoints
      - pods
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      annotations:
        homelab.zakharhome.org/prometheus-config-version: "2026-08-19-selfheal-cooldown-retune-1"
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
            - name: tmp
              mountPath: /tmp

        # Prometheus reads rule files only at process start. A ConfigMap edit
        # alone therefore lands the new rule on disk and nowhere else, and the
        # prometheus-config-version annotation above is a manual bump that is
        # easy to forget -- CleanMailGmailGrantDemoted sat unloaded for five days
        # in August 2026 despite being present in prometheus-rules the whole
        # time, and the alert it was meant to raise could not have fired.
        #
        # This watches the mounted rules directory and POSTs /-/reload (enabled
        # by --web.enable-lifecycle above) whenever the projected contents
        # change, so a rule edit goes live on Flux's own reconcile without a pod
        # roll. Prometheus keeps its TSDB and in-memory state; only the config is
        # re-read. The annotation stays useful for changes to prometheus.yml
        # itself, which is a subPath mount and does not update in place.
        - name: configmap-reload
          image: ghcr.io/jimmidyson/configmap-reload:v0.13.1
          args:
            - --volume-dir=/etc/prometheus/rules
            - --webhook-url=http://127.0.0.1:9090/-/reload
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30090
