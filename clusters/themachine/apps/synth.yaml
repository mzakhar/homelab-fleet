apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: audio-tools
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/mzakhar/Audio-Tools
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synth
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: audio-tools
  wait: true
  timeout: 5m
  # The app repo's deployment.yaml references the floating :main tag. Pin the
  # digest here, the same way clean-mail is pinned, so a rebuild of :main never
  # rolls the cluster on its own — a deploy is a change to this file.
  # sha256:2f3fab50 = Audio-Tools 2b4a271 (browser .sf2 import, centred dialogs,
  # working recorder worklet, synth layout).
  images:
    - name: ghcr.io/mzakhar/audio-tools
      digest: sha256:2f3fab506a44293506c4a3c1bfd2c8e60cc4b98f903a3fd0ef511037e12c9a16
