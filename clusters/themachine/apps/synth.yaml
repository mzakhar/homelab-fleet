apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: audio-tools
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/mzakhar/Audio-Tools
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synth
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: audio-tools
  wait: true
  timeout: 5m
  # The app repo's deployment.yaml references the floating :main tag. Pin the
  # digest here, the same way clean-mail is pinned, so a rebuild of :main never
  # rolls the cluster on its own — a deploy is a change to this file.
  # c767c2e = pads: Drum Kit instrument (16 distinct 909 pads, hat choke,
  # velocity timbre), SMC-PAD velocity curve, and SMC-PAD pad colours over
  # vendor SysEx (requestMIDIAccess now asks for sysex). Includes 23ee9d8 retro UI.
  # Renderer only; the discovery image is unchanged.
  images:
    - name: ghcr.io/mzakhar/audio-tools
      digest: sha256:c243b14e337e3de484022d957e65a77818609e4d31f461644a2285b9f6322254
    - name: ghcr.io/mzakhar/audio-tools-discovery
      digest: sha256:6e246934416b3ecab83e63bf3268a206b4b8bb8f95e301564c31ff0ac8427205
