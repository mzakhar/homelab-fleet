apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: audio-tools
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/mzakhar/Audio-Tools
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synth
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: audio-tools
  wait: true
  timeout: 5m
  # The app repo's deployment.yaml references the floating :main tag. Pin the
  # digest here, the same way clean-mail is pinned, so a rebuild of :main never
  # rolls the cluster on its own — a deploy is a change to this file.
  # 26eec4a = palette knob values become project state (schema v6) with presets,
  # and the assistant's last four phases: palette param, pack patch and preset
  # actions, an ask mode that answers from the digest without an actions field,
  # and Electron parity. Both images move — the proxy learns `mode: 'ask'`.
  images:
    - name: ghcr.io/mzakhar/audio-tools
      digest: sha256:c47f85b30b25cbd28e6e5af3ea971302d15e29febce6117e7ace7b94924fc594
    - name: ghcr.io/mzakhar/audio-tools-discovery
      digest: sha256:6e246934416b3ecab83e63bf3268a206b4b8bb8f95e301564c31ff0ac8427205
