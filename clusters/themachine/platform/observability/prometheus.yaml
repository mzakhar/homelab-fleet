apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]

      - job_name: linux-hosts
        static_configs:
          - targets:
              - "192.168.1.3:9100"
            labels:
              instance: themachine
              role: web-app-host
          - targets:
              - "192.168.1.2:9100"
            labels:
              instance: homeserver
              role: media-nas

      - job_name: otel-collector
        static_configs:
          - targets:
              - "otel-collector:8888"
              - "otel-collector:9464"

      - job_name: observability-services
        metrics_path: /metrics
        static_configs:
          - targets:
              - "tempo:3200"

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - "kube-state-metrics:8080"

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: "(.+)"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: "([^:]+)(?::\\d+)?;(\\d+)"
            replacement: "$1:$2"
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: app

      - job_name: kubernetes-service-endpoints
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: "(.+)"
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: "([^:]+)(?::\\d+)?;(\\d+)"
            replacement: "$1:$2"
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: replace
            target_label: endpoint

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: observability
data:
  alert-rules.yml: |
    groups:
      - name: homelab.rules
        rules:
          - alert: PrometheusTargetDown
            expr: up == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus target down"
              description: "{{ $labels.job }} target {{ $labels.instance }} has been down for more than 2 minutes."

          - alert: NodeFilesystemAlmostFull
            expr: 100 * (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) > 85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Node filesystem almost full"
              description: "{{ $labels.instance }} {{ $labels.mountpoint }} is above 85% used."

          - alert: NodeFilesystemCritical
            expr: 100 * (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) > 95
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node filesystem critical"
              description: "{{ $labels.instance }} {{ $labels.mountpoint }} is above 95% used."

          - alert: KubernetesDeploymentUnavailable
            expr: kube_deployment_status_replicas_unavailable > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Kubernetes deployment unavailable"
              description: "{{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas."

          - alert: KubernetesPodRestartSpike
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod restart spike"
              description: "{{ $labels.namespace }}/{{ $labels.pod }} restarted more than 3 times in 15 minutes."

          - alert: OtelCollectorRefusedTelemetry
            expr: sum(rate(otelcol_receiver_refused_spans[5m])) + sum(rate(otelcol_receiver_refused_metric_points[5m])) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "OpenTelemetry Collector refusing telemetry"
              description: "Collector refused spans or metric points in the last 5 minutes."

          - alert: UptimeKumaStatusPageUnavailable
            expr: uptime_kuma_status_page_up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Uptime Kuma status page unavailable"
              description: "Action Runner cannot read the Uptime Kuma homelab status page."

          - alert: UptimeKumaMonitorDown
            expr: uptime_kuma_monitor_up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Uptime Kuma monitor down"
              description: "Uptime Kuma monitor {{ $labels.monitor_name }} is currently down."

      - name: apps.rules
        # Stable HTTP semantic conventions only. Every instrumented app must
        # emit http_server_request_duration_seconds with http_response_status_code;
        # Python apps need OTEL_SEMCONV_STABILITY_OPT_IN=http or http/dup.
        rules:
          - alert: AppHttpServerErrorRate
            expr: |
              sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name!="",http_response_status_code=~"5.."}[5m]))
                /
              sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name!=""}[5m]))
                > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service_name }} 5xx rate above 5%"
              description: "{{ $labels.service_name }} served more than 5% HTTP 5xx responses over the last 5 minutes."

          - alert: AppHttpServerErrorRateCritical
            expr: |
              sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name!="",http_response_status_code=~"5.."}[5m]))
                /
              sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name!=""}[5m]))
                > 0.25
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.service_name }} 5xx rate above 25%"
              description: "{{ $labels.service_name }} served more than 25% HTTP 5xx responses over the last 5 minutes."

          - alert: AppHttpServerLatencyHigh
            expr: |
              histogram_quantile(0.95, sum by (service_name, le) (rate(http_server_request_duration_seconds_bucket{service_name!=""}[5m]))) > 3
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service_name }} p95 latency above 3s"
              description: "{{ $labels.service_name }} p95 HTTP server latency stayed above 3 seconds for 10 minutes."

          # Catches an app that silently drops off stable semconv (bad
          # OTEL_SEMCONV_STABILITY_OPT_IN, downgrade) and would otherwise lose
          # every app rule above without any alert firing.
          - alert: AppMissingStableHttpMetrics
            expr: |
              count by (service_name) (http_server_duration_milliseconds_count{service_name!=""})
                unless
              count by (service_name) (http_server_request_duration_seconds_count{service_name!=""})
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service_name }} emitting legacy HTTP metrics only"
              description: "An app exports http_server_duration_milliseconds but no http_server_request_duration_seconds, so app error and latency rules cannot evaluate for it."

      - name: clean-mail.rules
        rules:
          - alert: CleanMailFcmSendFailing
            expr: sum(rate(cleanmail_fcm_send_attempts_total{outcome!="success"}[10m])) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Clean Mail push delivery failing"
              description: "Clean Mail FCM send attempts returned a non-success outcome over the last 10 minutes."

          # Gauge is seconds remaining until expiry, not an absolute epoch —
          # live value 536400 (~6.2 days). Do not subtract time() here.
          - alert: CleanMailGmailWatchExpiring
            expr: min(cleanmail_gmail_watch_expiration_seconds) < 86400
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Clean Mail Gmail watch expiring"
              description: "Clean Mail Gmail push watch expires in under 24 hours; renewal is failing or stalled."

          # Steady state puts every observation in the 750-1000s bucket, so a
          # quantile threshold near 900 is pure interpolation noise. Count the
          # observations above the next boundary instead — exact, no guessing.
          - alert: CleanMailGmailCursorStale
            expr: |
              sum(rate(cleanmail_gmail_cursor_age_seconds_bucket{le="+Inf"}[15m]))
                - sum(rate(cleanmail_gmail_cursor_age_seconds_bucket{le="2500"}[15m]))
                > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Clean Mail Gmail cursor falling behind"
              description: "Clean Mail Gmail sync cursor age exceeded 2500s; mail ingestion is lagging."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - services
      - endpoints
      - pods
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      annotations:
        homelab.zakharhome.org/prometheus-config-version: "2026-07-30-stable-semconv-1"
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30090
