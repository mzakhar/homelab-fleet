apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: audio-tools
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/mzakhar/Audio-Tools
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synth
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: audio-tools
  wait: true
  timeout: 5m
  # The app repo's deployment.yaml references the floating :main tag. Pin the
  # digest here, the same way clean-mail is pinned, so a rebuild of :main never
  # rolls the cluster on its own — a deploy is a change to this file.
  # 4085897 = DAW-control assistant. Plan schema is non-strict (OpenAI rejects a
  # strict schema whose args cannot be closed), and upstream failures answer 424
  # so Cloudflare does not replace the JSON error with its own 5xx page.
  images:
    - name: ghcr.io/mzakhar/audio-tools
      digest: sha256:f0379a4051b51511b2532cc4eafa440765b0e7b03ab699aa42c5fe84480b499d
    - name: ghcr.io/mzakhar/audio-tools-discovery
      digest: sha256:c823b9f38c92396b89c0c07684503d9b3a3adf745fabd3a1f18c53cf316c512b
