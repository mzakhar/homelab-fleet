apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: action-runner
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 10m
      # Split by severity: a critical that nobody has cleared should keep
      # nagging, a warning should not re-page twice a day for three days. The
      # flat 12h did exactly that during the 2026-08-14..17 kitchen-hub fault.
      repeat_interval: 6h
      routes:
        - matchers: [severity="warning"]
          repeat_interval: 24h

    # One fault, one notification. A wedged USB digitizer on kitchen-hub emits
    # the touchscreen alert, the kiosk alert, and a target-down for every
    # self-heal reboot -- all of them symptoms of the condition
    # KitchenHubSelfHealThrashing already names, and none of them separately
    # actionable. `equal: [instance]` is what keeps this scoped: a
    # PrometheusTargetDown for homeserver is untouched.
    inhibit_rules:
      - source_matchers: [alertname="KitchenHubSelfHealThrashing"]
        target_matchers:
          - alertname=~"KitchenHubTouchscreenMissing|KitchenHubKioskUnavailable|PrometheusTargetDown"
        equal: [instance]

    receivers:
      - name: action-runner
        webhook_configs:
          - url: http://action-runner.action-runner.svc.cluster.local:8080/alerts/webhook
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      annotations:
        # Alertmanager mounts alertmanager.yml from a ConfigMap and never
        # reloads it: a ConfigMap change neither restarts the pod nor triggers a
        # reload, so without a bump here the config in git is not the config
        # running. That is exactly how the 2026-08-10 kitchen-hub scrape target
        # reached the cluster while the pod kept serving the previous config —
        # see Machines.md. alloy, loki and prometheus all carry one of these;
        # this deployment was the one that did not.
        homelab.zakharhome.org/alertmanager-config-version: "2026-08-17-kitchen-hub-alert-fatigue-1"
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
  annotations:
    # Picked up by the kubernetes-service-endpoints scrape job. Without this,
    # alertmanager_notifications_failed_total exists on the pod but not in
    # Prometheus, so nothing can alert on the alert path itself.
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "9093"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
