apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: audio-tools
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/mzakhar/Audio-Tools
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synth
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: audio-tools
  wait: true
  timeout: 5m
  # The app repo's deployment.yaml references the floating :main tag. Pin the
  # digest here, the same way clean-mail is pinned, so a rebuild of :main never
  # rolls the cluster on its own — a deploy is a change to this file.
  # ae33c2d = pack MIDI bend/mod controls reach sample voices.
  images:
    - name: ghcr.io/mzakhar/audio-tools
      digest: sha256:d1952d4cf2339caeb3a2c1517cf3eb70b3d5174bba1423dafcccfc32a50a5a01
    - name: ghcr.io/mzakhar/audio-tools-discovery
      digest: sha256:48d6c0417d31b2dda24b30928ef206f07afef21cb7a4a98ae842f3024c671f41
