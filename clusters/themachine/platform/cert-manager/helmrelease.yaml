# First HelmRelease in this fleet — every other app is plain manifests. cert-manager
# ships as a chart plus a CRD set that has to be installed and upgraded together, and
# vendoring its ~5 MB static manifest into git to avoid one chart is the worse trade.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # The chart's own CRD install. Without this the ClusterIssuer in this same
    # kustomization has no type to apply against.
    crds:
      enabled: true
      keep: true
    # Single-node cluster, one certificate. Defaults are sized for a fleet.
    replicaCount: 1
    webhook:
      replicaCount: 1
    cainjector:
      replicaCount: 1
