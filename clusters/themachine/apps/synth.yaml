apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: audio-tools
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/mzakhar/Audio-Tools
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synth
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: audio-tools
  wait: true
  timeout: 5m
  # The app repo's deployment.yaml references the floating :main tag. Pin the
  # digest here, the same way clean-mail is pinned, so a rebuild of :main never
  # rolls the cluster on its own — a deploy is a change to this file.
  # 0ee4bb0 = DAW-control assistant: /api/assistant on the discovery proxy, plus
  # the assistant dialog in the renderer. Ingress prefix widened to /api, so both
  # images move together.
  images:
    - name: ghcr.io/mzakhar/audio-tools
      digest: sha256:33b41482552e7e73a93a43daada2355c3fbdf06de512eabdd17cb1419323ac5e
    - name: ghcr.io/mzakhar/audio-tools-discovery
      digest: sha256:faa83992804b17703f3a72f856de8d692a86ebf133398ba706cd557265c10e43
