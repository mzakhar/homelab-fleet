# DNS-01, not HTTP-01. An HTTP-01 challenge has to reach Traefik from the public
# internet, and every zakharhome.org hostname sits behind Cloudflare Access — the
# challenge path would need its own bypass policy, which is the thing we just spent a
# week deleting. DNS-01 also issues for hostnames that are not publicly reachable at
# all, which is the whole point of the tailnet path.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: mark.zakhar@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
