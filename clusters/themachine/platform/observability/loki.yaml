apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 168h

    ruler:
      alertmanager_url: http://alertmanager:9093
      enable_alertmanager_v2: true
      enable_api: true
      # Rules come from the loki-rules ConfigMap, not the PVC. With
      # auth_enabled: false the tenant is "fake", so files must live in
      # <directory>/fake/ — that is where the ConfigMap is mounted.
      storage:
        type: local
        local:
          directory: /etc/loki/rules
      # Scratch space for rule evaluation; the root filesystem is read-only.
      rule_path: /tmp/loki-ruler
      ring:
        kvstore:
          store: inmemory

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: observability
data:
  clean-mail.yaml: |
    groups:
      - name: clean-mail-logs
        interval: 1m
        rules:
          # Clean Mail logs are structured JSON with a `level` field. Parse it
          # rather than regex-matching "error" across raw lines: a naive regex
          # matches roughly 140 benign lines per 6h in observability and
          # flux-system. `__error__=""` drops the non-JSON access-log lines.
          #
          # Baseline measured 2026-07-30: zero ERROR or CRITICAL lines in 24h
          # against 2239 INFO and 12 WARNING in 6h. The threshold is set to
          # catch a burst rather than a single transient failure.
          #
          # This covers what the HTTP metrics cannot: background worker and
          # Gmail sync failures that never surface as a 5xx response.
          - alert: CleanMailErrorLogs
            expr: |
              sum(count_over_time({namespace="clean-mail"} | json | __error__="" | level=~"ERROR|CRITICAL" [10m])) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Clean Mail logging errors"
              description: "Clean Mail emitted more than 3 ERROR or CRITICAL log lines in 10 minutes. Baseline is zero."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
  labels:
    app.kubernetes.io/name: loki
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # Single PVC, single replica: the old pod must release the volume
    # before the new one starts, or init fails on the contended store.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      annotations:
        # The Loki config mounts with subPath, which never receives ConfigMap
        # updates. Bump this on every loki.yaml change.
        homelab.zakharhome.org/loki-config-version: "2026-07-30-ruler-1"
      labels:
        app.kubernetes.io/name: loki
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.2.1
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/loki/loki.yaml
              subPath: loki.yaml
            - name: data
              mountPath: /loki
            - name: tmp
              mountPath: /tmp
            # Whole-directory mount so rule edits reach the pod without a
            # restart; the ruler re-reads this path on its poll interval.
            - name: rules
              mountPath: /etc/loki/rules/fake
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
        - name: tmp
          emptyDir: {}
        - name: rules
          configMap:
            name: loki-rules
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
  labels:
    app.kubernetes.io/name: loki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
---
# LAN-only ingestion for non-Kubernetes hosts. Loki has no Ingress; the
# firewall/router must never publish this NodePort to the internet.
apiVersion: v1
kind: Service
metadata:
  name: loki-lan
  namespace: observability
  labels:
    app.kubernetes.io/name: loki
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
      nodePort: 30310
---
# Loki stores sensitive logs. Keep the LAN receiver limited to kitchen-hub;
# observability pods retain their in-namespace access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - ipBlock:
            cidr: 192.168.1.48/32
        - ipBlock:
            cidr: 192.168.1.3/32
      ports:
        - protocol: TCP
          port: 3100
