apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: audio-tools
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/mzakhar/Audio-Tools
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synth
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: audio-tools
  wait: true
  timeout: 5m
  # The app repo's deployment.yaml references the floating :main tag. Pin the
  # digest here, the same way clean-mail is pinned, so a rebuild of :main never
  # rolls the cluster on its own — a deploy is a change to this file.
  # sha256:e5beefbc = Audio-Tools c0fe592 (sequencer rows follow the armed
  # instrument; imported SoundFonts carry GM fallbacks).
  images:
    - name: ghcr.io/mzakhar/audio-tools
      digest: sha256:e5beefbc02648a993ba2ac395d344ea89236822c0d48c23f7d773e5e2da8d416
