apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: audio-tools
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/mzakhar/Audio-Tools
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synth
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: audio-tools
  wait: true
  timeout: 5m
  # The app repo's deployment.yaml references the floating :main tag. Pin the
  # digest here, the same way clean-mail is pinned, so a rebuild of :main never
  # rolls the cluster on its own — a deploy is a change to this file.
  # 23ee9d8 = retro instrument UI redesign: warm light theme is the new default,
  # tokenised dark/rainbow, canvases follow the theme, every surface restyled.
  # Renderer only; the discovery image is unchanged.
  images:
    - name: ghcr.io/mzakhar/audio-tools
      digest: sha256:1b8b184bf6b5761017151b832cd0102ca0be6f533e3d8bce855799f0037474eb
    - name: ghcr.io/mzakhar/audio-tools-discovery
      digest: sha256:6e246934416b3ecab83e63bf3268a206b4b8bb8f95e301564c31ff0ac8427205
