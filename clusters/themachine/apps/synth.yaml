apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: audio-tools
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/mzakhar/Audio-Tools
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synth
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: audio-tools
  wait: true
  timeout: 5m
  # The app repo's deployment.yaml references the floating :main tag. Pin the
  # digest here, the same way clean-mail is pinned, so a rebuild of :main never
  # rolls the cluster on its own — a deploy is a change to this file.
  # 7242302 = pads phase 2: Pads view (F5) with loop player, metronome/count-in,
  # Layer/Wipe/undo, Snap and Groove; schema v7 (project kits + pads settings).
  # Includes c767c2e pads phase 1 + SMC-PAD colours and 23ee9d8 retro UI.
  # Renderer only; the discovery image is unchanged.
  images:
    - name: ghcr.io/mzakhar/audio-tools
      digest: sha256:efccdafbb6bc4784e856068c1ddda614daf612ba721ff632fefd9b9d78e7ea78
    - name: ghcr.io/mzakhar/audio-tools-discovery
      digest: sha256:6e246934416b3ecab83e63bf3268a206b4b8bb8f95e301564c31ff0ac8427205
