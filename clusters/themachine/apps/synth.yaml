apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: audio-tools
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/mzakhar/Audio-Tools
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synth
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: audio-tools
  wait: true
  timeout: 5m
  # The app repo's deployment.yaml references the floating :main tag. Pin the
  # digest here, the same way clean-mail is pinned, so a rebuild of :main never
  # rolls the cluster on its own — a deploy is a change to this file.
  # eda7c45 = DAW-control assistant, with the plan schema fix: strict json_schema
  # was rejected by OpenAI because args cannot be closed. Assistant dialog in the
  # renderer, /api/assistant on the proxy, ingress prefix /api.
  images:
    - name: ghcr.io/mzakhar/audio-tools
      digest: sha256:cd3e62b7cb31ab14702969e3d1b941c4769675cecb82379eea31039a94f5b903
    - name: ghcr.io/mzakhar/audio-tools-discovery
      digest: sha256:6034a7a02612b1c4b7f8610cf8acad41e21a371ac360d6f623c70a8856c307af
